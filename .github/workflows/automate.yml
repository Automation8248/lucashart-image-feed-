name: Image Post Automation

on:
  schedule:
    - cron: '0 5 * * *' # Roz 5:00 AM UTC par chalega
  workflow_dispatch: 

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Fonts (for PIL Image Text)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Install Python Packages
        run: |
          pip install requests Pillow

      - name: Run Automation Script
        env:
          SUCCESS_BOT_TOKEN: ${{ secrets.SUCCESS_BOT_TOKEN }}
          SUCCESS_CHAT_ID: ${{ secrets.SUCCESS_CHAT_ID }}
          ERROR_BOT_TOKEN: ${{ secrets.ERROR_BOT_TOKEN }}
          ERROR_CHAT_ID: ${{ secrets.ERROR_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python main.py

      - name: Commit Updated History
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update 30-day cooling history for Image Post"
          
          # Niche wali line error ko solve karegi (Latest changes pull karke rebase karna)
          git pull --rebase origin main
          
          git push
